# =============================
# Server
# =============================
server.port=8080

# =============================
# MySQL
# =============================
spring.datasource.url=jdbc:mysql://localhost:3306/resume_screener?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=bhuban
spring.datasource.password=Bhuban@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================
# JPA / Hibernate
# =============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =============================
# File upload
# =============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# =============================
# Logging
# =============================
logging.level.com.resumescreener=DEBUG
logging.level.org.springframework.web=INFO
